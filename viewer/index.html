<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ColorStack</title>
<link rel="icon" type="image/png" sizes="256x256" href="icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
  :root {
    --bg: #f3f4f2; --panel: #ffffff; --panel-2: #f7f8f6; --text: #191b1a; --muted: #6b716d; --faint: #9aa09c;
    --line: #e2e4e1; --accent: #0f9f68; --accent-soft: #e3f5ec; --accent-text: #ffffff; --scene: #eceeeb;
    --bad: #c2410c; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121413; --panel: #1a1c1b; --panel-2: #202321; --text: #e9ebe9; --muted: #9aa19c; --faint: #6c736e;
      --line: #2c302d; --accent: #34c98b; --accent-soft: #173326; --accent-text: #08130e; --scene: #161817;
      --bad: #fb923c; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #121413; --panel: #1a1c1b; --panel-2: #202321; --text: #e9ebe9; --muted: #9aa19c; --faint: #6c736e;
    --line: #2c302d; --accent: #34c98b; --accent-soft: #173326; --accent-text: #08130e; --scene: #161817;
    --bad: #fb923c; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; height: 100vh; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  input[type=range] { accent-color: var(--accent); }

  /* top bar */
  header { height: 48px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 10px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 14px; letter-spacing: -.01em; white-space: nowrap; }
  .brand img { width: 18px; height: 18px; }
  #fileName { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  .icon-btn { width: 32px; height: 32px; flex: none; display: grid; place-items: center; border-radius: 8px; border: 0;
              background: transparent; cursor: pointer; color: var(--muted); }
  .icon-btn:hover { background: var(--panel-2); color: var(--text); }
  .icon-btn svg { width: 18px; height: 18px; }
  .seg { display: inline-flex; flex: none; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .seg button { border: 0; background: transparent; padding: 3px 10px; border-radius: 6px; cursor: pointer; color: var(--muted); }
  .seg button.on { background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
  .toggle { display: inline-flex; flex: none; align-items: center; gap: 7px; color: var(--muted); cursor: pointer; user-select: none; }
  .toggle input { appearance: none; width: 28px; height: 16px; border-radius: 8px; background: var(--line); position: relative;
                  cursor: pointer; transition: background .15s; margin: 0; flex: none; }
  .toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%;
                         background: var(--panel); transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .toggle input:checked { background: var(--accent); }
  .toggle input:checked::after { transform: translateX(12px); }
  .open-btn { display: none; align-items: center; padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px;
              cursor: pointer; color: var(--muted); background: var(--panel); white-space: nowrap; }
  .open-btn:hover { color: var(--text); }
  .open-btn input { display: none; }
  body.standalone .open-btn { display: inline-flex; }

  /* layout */
  #stage { flex: 1; min-height: 0; display: flex; position: relative; }
  #app { width: 300px; min-width: 240px; max-width: 70vw; flex: none; position: relative; display: flex; flex-direction: column;
         background: var(--panel); border-right: 1px solid var(--line); }
  #app[hidden] { display: none; }
  #grip { position: absolute; top: 0; bottom: 0; right: -4px; width: 8px; cursor: col-resize; z-index: 5; }
  #grip::after { content: ""; position: absolute; top: 0; bottom: 0; left: 3px; width: 2px; background: transparent; transition: background .15s; }
  #grip:hover::after, #grip.drag::after { background: var(--accent); }
  @media (max-width: 760px) { #grip { display: none; } #app { max-width: none; } }
  #appScroll { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  #appFoot { padding: 12px 14px; border-top: 1px solid var(--line); display: flex; gap: 12px; align-items: center; }
  .card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .card h3 { margin: 0 0 4px; font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  .f { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 3px 0; }
  .f .lab { color: var(--text); cursor: help; text-decoration: underline dotted var(--faint); text-underline-offset: 3px; }
  .num { display: inline-flex; align-items: center; flex: none; background: var(--panel); border: 1px solid var(--line); border-radius: 7px;
         height: 28px; padding-right: 8px; width: 132px; }
  .num:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .num input { border: 0; outline: 0; background: transparent; width: 100%; min-width: 0; text-align: right; padding: 0 4px 0 8px;
               font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
  .num input::-webkit-inner-spin-button, .num input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .num span { color: var(--faint); font-size: 12px; min-width: 38px; padding-left: 4px; white-space: nowrap; }
  details.card summary { cursor: pointer; list-style: none; font-size: 11px; font-weight: 650; text-transform: uppercase;
                         letter-spacing: .07em; color: var(--muted); display: flex; justify-content: space-between; }
  details.card summary::-webkit-details-marker { display: none; }
  details.card summary::after { content: "+"; font-size: 15px; line-height: 1; }
  details.card[open] summary::after { content: "\2013"; }
  details.card h4 { margin: 10px 0 2px; font-size: 11px; color: var(--faint); font-weight: 600; }
  .btn { height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); padding: 0 14px;
         cursor: pointer; font-weight: 600; white-space: nowrap; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); flex: 1; }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn:disabled { opacity: .6; cursor: default; filter: none; }
  .link { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0; white-space: nowrap; }
  .link:hover { color: var(--text); }
  @keyframes spin { to { transform: rotate(360deg); } }
  #err { color: var(--bad); font-size: 12px; word-break: break-word; }
  #err:empty { display: none; }

  /* export menu */
  .tools { display: flex; align-items: center; gap: 2px; padding-left: 8px; margin-left: 4px; border-left: 1px solid var(--line); }
  body.standalone .app-only { display: none; }
  /* info boxes: label / value rows like Orca's estimate */
  .stats.info { display: grid; grid-template-columns: auto auto; gap: 1px 14px; }
  .stats.info:empty { display: none; }
  .info b { grid-column: 1 / -1; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 3px; }
  .info span:nth-child(even) { color: var(--muted); }
  .info span:nth-child(odd) { text-align: right; font-weight: 600; }
  .info span.msg { grid-column: 1 / -1; text-align: left; font-weight: 400; color: var(--muted); }
  body:not(.standalone) .standalone-only { display: none !important; }
  .spacer { flex: 1; }
  .btn.run { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; flex: none; }
  .btn.run svg { width: 16px; height: 16px; }
  .btn.run.busy svg { animation: spin .9s linear infinite; }
  .btn.run { position: relative; overflow: hidden; }
  .btn.run > :not(.prog) { position: relative; }
  .btn.run .prog { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: currentColor; opacity: .18;
                  transition: width .4s linear; }
  .icon-btn:disabled { opacity: .35; cursor: default; background: transparent; }
  .menu-wrap { position: relative; }
  .menu { position: absolute; top: 38px; left: 0; z-index: 20; width: 300px; padding: 10px; border-radius: 10px; background: var(--panel);
          border: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; }
  .menu[hidden] { display: none; }
  .menu .xbtn { display: flex; align-items: center; justify-content: center; flex: none; text-decoration: none; }
  .menu .msec { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-top: 4px; }
  .btn.sm { height: 30px; padding: 0 10px; }
  .xrow { display: flex; gap: 6px; }
  .xrow input { flex: 1; min-width: 0; height: 30px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
                padding: 0 8px; font-size: 12px; }
  .xrow input:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .xmsg { font-size: 12px; word-break: break-all; }
  .xmsg:empty { display: none; }
  .toggle.small { font-size: 12px; }

  /* result card */
  .result { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); background: var(--accent-soft); }
  .result .head { font-size: 22px; font-weight: 700; letter-spacing: -.02em; color: var(--accent); line-height: 1.15; }
  .result .sub { color: var(--muted); margin: 1px 0 8px; }
  .cmp { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .cmp td { padding: 2px 0; }
  .cmp td:not(:first-child) { text-align: right; }
  .cmp td:first-child { color: var(--muted); }
  .cmp tr.total td { font-weight: 650; border-top: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line)); padding-top: 5px; }
  .cmp td.arrow { color: var(--faint); text-align: center; width: 22px; }
  .result .meta { font-size: 12px; color: var(--muted); margin-top: 8px; }

  /* viewport */
  #wrap { position: relative; flex: 1; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  .stats { position: absolute; top: 10px; display: flex; align-items: baseline; gap: 10px; padding: 7px 11px; border-radius: 9px;
           background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); box-shadow: var(--shadow);
           font-variant-numeric: tabular-nums; pointer-events: none; max-width: calc(50% - 20px); backdrop-filter: blur(6px);
           white-space: nowrap; overflow: hidden; }
  .stats:empty { display: none; }
  #statsB { left: calc(50% + 10px); }
  .divider { position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: var(--line); }
  #wrap.narrow .stats { max-width: calc(100% - 20px); }
  #wrap.narrow #statsB { top: calc(50% + 10px); left: 10px; }
  #wrap.narrow .divider { left: 0; right: 0; top: 50%; bottom: auto; width: auto; height: 1px; }
  #drop { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 16px;
          pointer-events: none; }
  #drop div { max-width: 340px; }
  #drop b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }
  /* legend with the original's info box under it, same width */
  #side { position: absolute; left: 10px; top: 10px; max-height: calc(100% - 120px); display: flex; flex-direction: column;
          gap: 8px; pointer-events: none; }
  #side .stats { position: static; max-width: none; }
  #legend { padding: 8px 10px; border-radius: 9px; font-size: 12px; min-height: 0;
            background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); box-shadow: var(--shadow);
            overflow: hidden; backdrop-filter: blur(6px); }
  #legend:empty { display: none; }
  #legend div { display: flex; align-items: center; gap: 7px; white-space: nowrap; line-height: 1.65; }
  #legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  #legend b { display: block; margin-bottom: 2px; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

  /* layer rail */
  #rail { width: 64px; position: absolute; right: 0; top: 0; bottom: 0; }
  #vs { position: absolute; left: 0; right: 0; top: 40px; bottom: 40px; touch-action: none; }
  #vs .vtrack { position: absolute; right: 14px; top: 0; bottom: 0; width: 4px; border-radius: 2px; background: var(--line); }
  #vs .vfill { position: absolute; right: 14px; width: 4px; border-radius: 2px; background: var(--accent); }
  .vthumb { position: absolute; right: 8px; width: 16px; height: 16px; margin-bottom: -8px; border-radius: 50%;
            background: var(--panel); border: 2px solid var(--accent); cursor: grab; outline: none; touch-action: none; box-shadow: var(--shadow); }
  .vthumb:focus-visible { box-shadow: 0 0 0 3px var(--accent-soft); }
  .vthumb span { position: absolute; right: 20px; top: -1px; font-size: 11px; color: var(--text); white-space: nowrap;
                 font-variant-numeric: tabular-nums; pointer-events: none; }
  #rail .cap { position: absolute; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--faint); white-space: nowrap; }
  #railTop { top: 12px; } #railBot { bottom: 12px; }

  /* playback bar */
  .bar { height: 52px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--panel);
         border-top: 1px solid var(--line); }
  #play { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-text);
          cursor: pointer; display: grid; place-items: center; flex: none; }
  #play svg { width: 14px; height: 14px; }
  #time { flex: 1; min-width: 80px; }
  #clock { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; cursor: help; }
  .bar select { height: 28px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 0 6px; }
  .bar .lbl { color: var(--faint); font-size: 12px; }
  .bar .num { width: 84px; } .bar .num span { min-width: 14px; }

  @media (max-width: 760px) {
    #stage { flex-direction: column; position: relative; }
    #app { width: auto; max-height: 50vh; border-right: 0; border-bottom: 1px solid var(--line); }
    #rail { position: absolute; right: 0; bottom: 0; height: min(100%, 60vh); background: transparent; border: 0; }
    #wrap { flex: 1; min-height: 240px; }
    .bar { gap: 8px; padding: 0 10px; }
    .bar .lbl, .bar .num, #speed, #fileName { display: none; }
    header { gap: 8px; }
    .seg button { padding: 3px 7px; }
    .toggle { font-size: 0; gap: 0; }
  }
</style>
</head>
<body>
<header>
  <button class="icon-btn" id="appBtn" hidden title="Show / hide settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
  <div class="brand"><img src="icon.svg" alt="">ColorStack</div>
  <div class="tools app-only">
    <label class="icon-btn" id="importBtn" title="Import G-code"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg><input type="file" id="upload" accept=".gcode" hidden></label>
    <div class="menu-wrap">
      <button class="icon-btn" id="exportBtn" title="Export (process a file first)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg></button>
      <div class="menu" id="exportMenu" hidden>
        <button class="btn primary xbtn" id="saveBtn">Export optimized file</button>
        <div class="msec">Send to printer</div>
        <div class="xrow"><input type="text" id="host"><button class="btn sm" id="sendBtn">Send</button></div>
        <label class="toggle small"><input type="checkbox" id="startPrint">Start printing after upload</label>
        <div class="xmsg" id="exportMsg"></div>
      </div>
    </div>
  </div>
  <div id="fileName"></div>
  <label class="open-btn">Original&hellip; <input type="file" id="fileA" accept=".gcode"></label>
  <label class="open-btn">Processed&hellip; <input type="file" id="fileB" accept=".gcode"></label>
  <div class="seg" role="group" aria-label="Colour by"><button data-mode="0" class="on">Filament</button><button data-mode="1">Line type</button><button data-mode="2">Non-planar</button></div>
  <label class="toggle"><input type="checkbox" id="travel">Travels</label>
  <button class="icon-btn" id="theme" title="Light / dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg></button>
</header>
<div id="stage">
  <aside id="app" hidden></aside>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div class="divider"></div>
    <div class="stats info" id="statsB"></div>
    <div id="side"><div id="legend"></div><div class="stats info" id="statsA"></div></div>
    <div id="drop"><div><b>No print loaded</b>Open an Orca G-code file. The original plays on the left and the ColorStack version on the right, on the same clock.</div></div>
  </div>
  <div id="rail">
    <div class="cap" id="railTop"></div>
    <div id="vs"><div class="vtrack"></div><div class="vfill" id="vfill"></div>
      <div class="vthumb" id="vlo" tabindex="0" role="slider" aria-label="Bottom layer"><span></span></div>
      <div class="vthumb" id="vhi" tabindex="0" role="slider" aria-label="Top layer"><span></span></div>
    </div>
    <div class="cap" id="railBot"></div>
  </div>
</div>
<div class="bar">
  <button id="play" title="Play / pause" aria-label="Play"></button>
  <input type="range" id="time" min="0" max="1000" value="1000" aria-label="Playback time">
  <span id="clock" title="Playback clock: distance / feedrate, no acceleration. The settings panel shows the real estimate."></span>
  <span class="lbl">Speed</span>
  <select id="speed" aria-label="Playback speed"><option value="60">60&times;</option><option value="300" selected>300&times;</option><option value="1200">1200&times;</option><option value="5000">5000&times;</option></select>
  <span class="lbl standalone-only">Swap</span>
  <span class="num standalone-only" title="Seconds one colour swap takes during playback (files without the app's estimate)"><input type="number" id="swapS" value="104" min="0"><span>s</span></span>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = (id) => document.getElementById(id);
const ICON_PLAY = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l9-5.5z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg>';
function setPlaying(on) {
  state.playing = on;
  $("play").innerHTML = on ? ICON_PAUSE : ICON_PLAY;
  $("play").setAttribute("aria-label", on ? "Pause" : "Play");
}
document.body.classList.add("standalone");
const root = document.documentElement;
try { const t = localStorage.getItem("cs-theme"); if (t) root.dataset.theme = t; } catch {}
$("theme").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("cs-theme", root.dataset.theme); } catch {}
  applyScene();
};

// ---------- Orca colours (libvgcode ViewerImpl.cpp DEFAULT_EXTRUSION_ROLES_COLORS / DEFAULT_OPTIONS_COLORS) ----------
// [label (Orca ;TYPE: string), r, g, b], in EGCodeExtrusionRole order
const ROLES = [
  ["Unknown", 230, 179, 179],          // None
  ["Inner wall", 255, 230, 77],        // Perimeter
  ["Outer wall", 255, 125, 56],        // ExternalPerimeter
  ["Overhang wall", 31, 31, 255],      // OverhangPerimeter
  ["Sparse infill", 176, 48, 41],      // InternalInfill
  ["Internal solid infill", 150, 84, 204], // SolidInfill
  ["Top surface", 240, 64, 64],        // TopSolidInfill
  ["Ironing", 255, 140, 105],          // Ironing
  ["Bridge", 77, 128, 186],            // BridgeInfill
  ["Gap infill", 255, 255, 255],       // GapFill
  ["Skirt", 0, 135, 110],              // Skirt
  ["Support", 0, 255, 0],              // SupportMaterial
  ["Support interface", 0, 128, 0],    // SupportMaterialInterface
  ["Prime tower", 179, 227, 171],      // WipeTower
  ["Custom", 94, 209, 148],            // Custom
  ["Bottom surface", 102, 92, 199],    // BottomSurface
  ["Internal Bridge", 77, 128, 186],   // InternalBridgeInfill
  ["Brim", 0, 59, 110],                // Brim
  ["Support transition", 0, 64, 0],    // SupportTransition
];
const ROLE_OF = Object.fromEntries(ROLES.map((r, i) => [r[0], i]));   // ;TYPE: string -> role (anything else -> 0)
// other slicers' feature names -> Orca's (same table as colorstack/reader.py)
const TYPE_ALIAS = { "WALL-OUTER": "Outer wall", "WALL-INNER": "Inner wall", "SKIN": "Top surface", "FILL": "Sparse infill",
  "SUPPORT": "Support", "SUPPORT-INTERFACE": "Support interface", "SKIRT": "Skirt", "PRIME-TOWER": "Prime tower",
  "External perimeter": "Outer wall", "Perimeter": "Inner wall", "Overhang perimeter": "Overhang wall",

// ---------- G-code parsing ----------
// Extrusions are collected into polylines so the shader gets the join angle at each vertex (libvgcode
// extract_pos_and_or_hwa). Time per move = distance / feedrate.
function parse(text) {

        const px = p ? v.x - p.x : 0, py = p ? v.y - p.y : 0, pz = p ? v.z - p.z : 0;
        const tx = q ? q.x - v.x : 0, ty = q ? q.y - v.y : 0, tz = q ? q.z - v.z : 0;

      else if (/^;\s*LAYER:\s*-?\d+/.test(raw) || raw.startsWith("; COLORSTACK") || raw.startsWith(";LAYER_CHANGE")) live = true;

    if (word === "M83") { absE = false; continue; }

    if (word === "G91") { absXYZ = false; continue; }

        if (Math.abs(sweep) < 1e-9) sweep = s[1] === "2" ? -2 * Math.PI : 2 * Math.PI;

      }

      const t0 = t;
      t += d / (f / 60);
      if (live && e > 0 && (nx !== x || ny !== y)) {
        if (!pl.length) pl.push({ x, y, z, w: width, h: height, role, tool, t: t0, tn: travN });
        for (let k = 1; k <= steps; k++) {
          const last = k === steps, u = k / steps;

  const setting = (k) => (text.match(new RegExp("^; " + k + " = (.*)$", "m")) || [])[1];
  const num = (k, d) => parseFloat((setting(k) || "").split(",")[0]) || d;
  const est = text.match(/^;\s*estimated printing time(?: \(normal mode\))?\s*=\s*(.+)$/m) || text.match(/^;TIME:(\d+)/m);
  let slicerTotal = null;

           hwA: new Float32Array(hwA), hwB: new Float32Array(hwB), tool: toolOf, role: roleOf, np: npOf,
           tseg: new Float64Array(tseg), travAt: new Uint32Array(travAt), swapsAt,
           trav: new Float32Array(trav), moveTime: t, min, max };
}

// Clock per print. With the app's estimate (p.est) motion is scaled to the estimated motion time and swaps take
// its per-swap time; otherwise distance / feedrate and the file's own per-swap time, else the Swap field.
function timeline(p) {
  const e = p.est;

  const each = e && e.swaps ? e.swap_s / e.swaps : p.swapEach || parseFloat($("swapS").value) || 0;
  const before = Float64Array.from({ length: p.swapsAt.length + 1 }, (_, i) => i * each);
  const out = new Float64Array(p.tseg.length);

  for (let i = 0; i < p.tseg.length; i++) {
    while (k < p.swapsAt.length && p.swapsAt[k] <= p.tseg[i]) k++;
    out[i] = p.tseg[i] * scale + before[k];
  }
  p.time = out;
  p.flush = before[p.swapsAt.length];
  p.swapTimes = Float64Array.from(p.swapsAt.map((s, i) => s * scale + before[i]));
  p.total = p.moveTime * scale + before[p.swapsAt.length];

const hexRgb = (h) => { const n = parseInt(h.replace("#", "").padEnd(6, "8").slice(0, 6), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };

function build(i, p) {

  const fil = p.colours.map(hexRgb);

    colF.set(fil[p.tool[k]] ?? fil[0], k * 3);
    const r = ROLES[p.role[k]];

  for (const [name, data] of [["aPosA", p.posA], ["aPosB", p.posB], ["aHwaA", p.hwA], ["aHwaB", p.hwB], ["aColF", colF], ["aColR", colR], ["aColN", colN]])

}

function frame() {

  const radius = 0.5 * Math.hypot(max[0] - min[0], max[1] - min[1], max[2] - min[2]);
  const dist = (radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2))) * 1.35;

  camera.position.copy(c).addScaledVector(ISO, dist);

}

// ---------- layer range slider ----------
let layers = [];          // sorted unique layer z across both prints

    if (!p.np[k]) set.add(Math.round((p.posA[k * 3 + 2] + 0.5 * p.hwA[k * 3]) * 1000));
  const keepTop = lay.hi >= layers.length - 1, keepBot = lay.lo === 0;

}

  $("vfill").style.bottom = frac(lay.lo) * 100 + "%";
  $("vfill").style.top = (1 - frac(lay.hi)) * 100 + "%";
  $("vlo").firstChild.textContent = N ? `${lay.lo + 1}` : "";
  $("vhi").firstChild.textContent = N ? `${lay.hi + 1}` : "";
  $("railTop").textContent = N ? `layer ${N}` : "";
  $("railBot").textContent = N ? "1" : "";

  if (!N) return;

  clipHi.constant = layers[lay.hi] + 0.6;

// ---------- loading ----------

  $("drop").style.display = "none";

    grip.classList.add("drag");
    const x0 = e.clientX, w0 = aside.getBoundingClientRect().width;
    const move = (ev) => { aside.style.width = Math.max(240, Math.min(innerWidth * 0.7, w0 + ev.clientX - x0)) + "px"; };
    const up = () => {
      grip.classList.remove("drag");
      grip.removeEventListener("pointermove", move);
      try { localStorage.setItem("cs-panel", Math.round(aside.getBoundingClientRect().width)); } catch {}
    };
    grip.addEventListener("pointermove", move);
    grip.addEventListener("pointerup", up, { once: true });
  });

  const read = () => {
    const out = {};
    for (const sec of cfg.sections) {
      out[sec.name] = {};
      for (const f of sec.fields) {
        const el = $(`cfg-${sec.name}-${f.key}`);
        out[sec.name][f.key] = !el ? f.value : f.type === "bool" ? el.checked : f.type === "str" ? el.value : parseFloat(el.value);
      }
    }
    return out;
  };
  const syncNozzle = () => rebuildNozzles({ tip_diameter: +$("cfg-nozzle-tip_diameter").value || 1,
    cone_angle: +$("cfg-nozzle-cone_angle").value || 45, clear_height: +$("cfg-nozzle-clear_height").value || 2 });
  for (const k of ["tip_diameter", "cone_angle", "clear_height"]) $(`cfg-nozzle-${k}`).addEventListener("input", syncNozzle);
  syncNozzle();
  $("saveCfg").onclick = async () => {
    const r = await fetch("/api/config", { method: "POST", body: JSON.stringify(read()) });
    $("saveCfg").textContent = r.ok ? "Saved" : "Save failed";
    setTimeout(() => ($("saveCfg").textContent = "Save defaults"), 2000);
  };

  const short = (sec) => {
    sec = Math.round(sec);
    const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
    return h ? `${h}h ${String(m).padStart(2, "0")}m` : `${m}m`;
  };
  const table = (r) => {
    const o = r.original, p = r.processed;
    const saved = o.total_s - p.total_s, pct = o.total_s ? Math.round((saved / o.total_s) * 100) : 0;
    const row = (label, a, b, cls = "") => `<tr class="${cls}"><td>${label}</td><td>${a}</td><td class="arrow">&rarr;</td><td>${b}</td></tr>`;
    const head = saved > 30 ? `${short(saved)} faster` : saved < -30 ? `${short(-saved)} slower` : "No time saved";
    return `<section class="card result">
      <div class="head">${head}</div>
      <div class="sub">${saved > 30 ? `${pct}% less print time` : o.swaps === p.swaps ? "No colour swaps could be removed with these settings" : ""}</div>
      <table class="cmp">
        ${row("Colour swaps", o.swaps, p.swaps)}
        ${row("Printing", short(o.motion_s), short(p.motion_s))}
        ${row("Swapping", short(o.swap_s), short(p.swap_s))}
        ${row("Total", short(o.total_s), short(p.total_s), "total")}
      </table>
      <div class="meta">${o.source === "slicer estimate" ? `Times from the slicer's own estimate, ${short(o.swap_each_s)} per colour change.` : "Times from ColorStack's motion estimate."}
        ${r.min_layer_time && r.min_layer_time.length ? `<br>Minimum layer time ${[...new Set(r.min_layer_time)].join(" / ")} s (${r.min_layer_source === "override" ? "your setting" : "from the file"}).` : ""}
        ${r.cooled_groups ? `<br>${r.cooled_groups} stacked regions slowed to the minimum layer time${r.cooled_short ? ` (${r.cooled_short} still under it at minimum speed${r.waits ? `, ${r.waits} lift-and-waits` : ""})` : ""}.` : ""}
        ${r.fanned_paths ? `<br>Part fan raised on ${r.fanned_paths} stacked lines.` : ""}
        ${r.per_object ? "<br>Per-object batching used." : ""}
        ${r.staggered ? "<br>Staggered colours used." : ""}
        ${r.visible_ceded_mm > 0.5 ? `<br>Colour edges moved on visible surfaces: ${r.visible_ceded_mm.toFixed(0)} mm.` : ""}</div>
    </section>`;
  };

  $("host").value = meta["export.printer_host"].value;
  $("exportBtn").onclick = (e) => { e.stopPropagation(); $("exportMenu").hidden = !$("exportMenu").hidden; };
  $("exportMenu").onclick = (e) => e.stopPropagation();
  document.addEventListener("click", () => ($("exportMenu").hidden = true));
  const bindExport = (output) => {
    $("exportBtn").disabled = false;
    $("exportBtn").title = "Export " + output;
    $("exportMsg").textContent = "";
    const msg = (t, bad) => { $("exportMsg").textContent = t; $("exportMsg").style.color = bad ? "var(--bad)" : "var(--accent)"; };
    $("saveBtn").onclick = async () => {
      const url = `/work/${encodeURIComponent(output)}`;
      if (!window.showSaveFilePicker) {        // no save dialog in this browser: plain download
        const a = Object.assign(document.createElement("a"), { href: url + "?download=1", download: output });
        document.body.append(a);      // Firefox only follows a link that is in the page
        a.click();
        a.remove();
        return;
      }
      try {
        const file = await showSaveFilePicker({ suggestedName: output, startIn: source || "downloads",
          types: [{ description: "G-code", accept: { "text/plain": [".gcode"] } }] });
        const w = await file.createWritable();
        await w.write(await (await fetch(url)).blob());
        await w.close();
        msg(`Saved ${file.name}`);
      } catch (e) { if (e.name !== "AbortError") msg(e.message, true); }
    };
    $("sendBtn").onclick = async () => {
      const start = $("startPrint").checked;
      $("sendBtn").disabled = true; msg(start ? "Uploading and starting the print…" : "Uploading…");
      try {
        const r = await fetch("/api/send", { method: "POST", body: JSON.stringify({ output, host: $("host").value, start }) });
        const j = await r.json();
        msg(r.ok ? (start ? "Uploaded and printing" : "Uploaded to the printer's G-code files") : j.error, !r.ok);
      } catch (e) { msg("Upload failed: " + e.message, true); }
      $("sendBtn").disabled = false;
    };
  };
  const setInput = async (name) => {
    current = name;
    $("fileName").textContent = name;
    $("panelHint").textContent = "Set the options, then Optimize file";
    $("exportBtn").disabled = true;
    $("result").innerHTML = "";
    unload(1);
    await loadUrl(0, `/work/${encodeURIComponent(name)}`, name);
  };
  const upload = async (file, handle = null) => {
    source = handle;
    $("err").textContent = "";
    const r = await fetch(`/api/upload?name=${encodeURIComponent(file.name)}`, { method: "POST", body: file });
    const j = await r.json();
    if (!r.ok) { $("err").textContent = j.error; return; }
    await setInput(j.name);
  };
  dropFile = upload;
  $("upload").onchange = (e) => e.target.files[0] && upload(e.target.files[0]);
  $("importBtn").onclick = async (e) => {    // the open dialog, where there is one, gives the file's folder too
    if (!window.showOpenFilePicker) return;
    e.preventDefault();
    try {
      const [handle] = await showOpenFilePicker({ types: [{ description: "G-code", accept: { "text/plain": [".gcode"] } }] });
      await upload(await handle.getFile(), handle);
    } catch (err) { if (err.name !== "AbortError") $("err").textContent = err.message; }
  };
  $("processBtn").onclick = async () => {
    if (!current) { $("err").textContent = "Import a G-code file first."; return; }
    $("err").textContent = ""; $("result").innerHTML = "";
    $("processBtn").disabled = true; $("processBtn").classList.add("busy"); $("processLabel").textContent = "Optimizing…";
    $("panelHint").textContent = "Optimizing…";
    let live = true;
    const tick = setInterval(async () => {
      try {
        const p = await (await fetch("/api/progress")).json();
        if (!live || !p.running) return;
        const pct = Math.round(p.fraction * 100);
        $("procBar").style.width = pct + "%";
        $("processLabel").textContent = `Optimizing ${pct}%` + (p.left == null ? ""
          : ` · ${p.left < 60 ? Math.max(5, Math.ceil(p.left / 5) * 5) + "s" : short(p.left)} left`);
        $("panelHint").textContent = p.stage;
      } catch {}
    }, 500);
    try {
      const r = await fetch("/api/process", { method: "POST", body: JSON.stringify({ input: current, config: read() }) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || r.status);
      $("result").innerHTML = table(j);
      bindExport(j.output);
      await Promise.all([
        loadUrl(0, `/work/${encodeURIComponent(j.input)}`, j.input, j.original),
        loadUrl(1, `/work/${encodeURIComponent(j.output)}`, j.output, j.processed),
      ]);
    } catch (e) { $("err").textContent = "Processing failed: " + e.message; }
    live = false;
    clearInterval(tick);
    $("procBar").style.width = "0";
    $("processBtn").disabled = false; $("processBtn").classList.remove("busy"); $("processLabel").textContent = "Optimize file";
    $("panelHint").textContent = $("exportBtn").disabled ? "Set the options, then Optimize file" : "Done: export from the top bar";
  };
  if (st.input && !q.get("a")) await setInput(st.input);
}

// drag and drop: two files = original + processed; one file = replaces the side it is dropped on (app: new input)
const stage = $("stage");
stage.addEventListener("dragover", (e) => e.preventDefault());
stage.addEventListener("drop", (e) => {
  e.preventDefault();
  const fs = [...e.dataTransfer.files];
  const handle = e.dataTransfer.items[0]?.getAsFileSystemHandle?.();     // must be asked for during the drop
  if (dropFile && fs[0]) return Promise.resolve(handle).then((h) => dropFile(fs[0], h?.kind === "file" ? h : null));
  const x = e.clientX < wrap.getBoundingClientRect().left + wrap.clientWidth / 2 ? 0 : 1;
  if (fs.length >= 2) { load(0, fs[0]); load(1, fs[1]); } else if (fs[0]) load(x, fs[0]);
});

// ?a=<url>&b=<url> preloads both files (url may carry ?n=<display name>)
const q = new URLSearchParams(location.search);
for (const [i, key] of [[0, "a"], [1, "b"]]) {
  const u = q.get(key);
  if (u) loadUrl(i, u, new URL(u, location.href).searchParams.get("n") || u);
}
if (q.get("swap")) $("swapS").value = q.get("swap");
// optional view state: ?mode=1 (line type) &t=0.5 (playback fraction) &lo=3&hi=40 (layer range) &theme=light|dark
if (q.get("theme")) { root.dataset.theme = q.get("theme"); applyScene(); }
if (q.get("mode")) setMode(q.get("mode"));
let viewParams = () => {
  if (q.get("b") && !(prints[0] && prints[1])) return;
  viewParams = null;
  if (q.get("t")) { state.t = parseFloat(q.get("t")) * maxTotal(); update(); }
  if (q.get("lo")) lay.lo = Math.max(0, parseInt(q.get("lo")) - 1);
  if (q.get("hi")) lay.hi = Math.min(layers.length - 1, parseInt(q.get("hi")) - 1);
  applyLayers(); legend();
};
initApp();
applyLayers();
</script>
</body>
</html>
